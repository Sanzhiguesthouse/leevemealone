<style>
  :root{
    --bg: #fbf2ef;
    --bg-soft: #fdf7f5;
    --panel: #f6e2e5;
    --panel-line: #ecc9cd;
    --accent: #b4707c;
    --accent-dark: #8c4f5a;
    --gold: #cf9a44;
    --gold-soft: #f6e9d2;
    --ink: #3f2b2e;
    --ink-soft: #8a7275;
    --font-display: 'Noto Serif TC', serif;
    --font-body: 'Noto Sans TC', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景遠山線稿：呼應「出走」的旅途意象，低調不喧賓奪主 */
  .scenery{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 38vh;
    pointer-events: none;
    z-index: 0;
  }
  .scenery svg{
    width: 100%;
    height: 100%;
    display: block;
  }

  .page{
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 6vh 6vw 4vh;
  }

  .brand{
    text-align: center;
    margin-bottom: 3.2rem;
  }

  .brand-mark{
    margin: 0 auto 0.7rem;
    width: 84px;
  }

  .brand-mark img{
    display: block;
    width: 100%;
    height: auto;
  }

  .brand h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.9rem, 4.4vw, 2.8rem);
    letter-spacing: 0.28em;
    margin: 0;
    color: var(--accent-dark);
    text-indent: 0.28em; /* 視覺置中，補齊 letter-spacing 造成的偏移 */
  }

  .brand .underline{
    width: 46px;
    height: 1px;
    background: var(--accent);
    margin: 0.9rem auto 0;
    opacity: 0.6;
  }

  nav.tabs{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem 0.4rem;
    margin-bottom: 3rem;
  }

  nav.tabs .tab{
    font-family: var(--font-body);
    font-size: 0.98rem;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 0.55rem 1.15rem;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
    font-weight: 400;
  }

  nav.tabs .tab:hover{
    color: var(--accent-dark);
  }

  nav.tabs .tab.active{
    color: var(--accent-dark);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }

  main.content{
    width: 100%;
    max-width: 760px;
    flex: 1;
    display: flex;
  }

  .pane{
    display: none;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    padding: 3rem 2.4rem;
    min-height: 260px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: fade 0.35s ease;
  }

  .pane.active{
    display: flex;
  }

  @keyframes fade{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .pane h2{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.35rem;
    letter-spacing: 0.16em;
    margin: 0 0 0.9rem;
    color: var(--accent-dark);
  }

  .pane p.placeholder{
    font-size: 0.9rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    margin: 0;
  }

  .address-link{
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--ink);
    font-size: 1rem;
    letter-spacing: 0.04em;
    padding: 0.6rem 1.1rem;
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    background: var(--bg-soft);
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    margin-bottom: 1.4rem;
  }

  .address-link:hover,
  .address-link:focus-visible{
    color: var(--accent-dark);
    border-color: var(--accent);
    background: #ffffff;
  }

  .address-link .pin-icon{
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--accent);
  }

  .transport-options{
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    width: 100%;
    max-width: 480px;
    margin-top: 0.3rem;
  }

  .transport-option{
    display: flex;
    align-items: flex-start;
    gap: 0.85rem;
    text-align: left;
    background: var(--bg-soft);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 1rem 1.15rem;
  }

  .transport-option.featured{
    background: var(--gold-soft);
    border-color: var(--gold);
  }

  .transport-option .option-icon{
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    color: var(--accent);
    margin-top: 0.15rem;
  }

  .transport-option.featured .option-icon{
    color: var(--gold);
  }

  .transport-option .option-text h3{
    margin: 0 0 0.3rem;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .transport-option .badge{
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 500;
    color: #fff;
    background: var(--gold);
    padding: 0.16rem 0.55rem;
    border-radius: 999px;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .transport-option .option-text p{
    margin: 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.65;
    letter-spacing: 0.02em;
  }

  .parking-gallery{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    width: 100%;
    max-width: 560px;
    margin-top: 0.9rem;
  }

  .parking-gallery.single-column{
    grid-template-columns: 1fr;
    max-width: 320px;
    margin-top: 1rem;
  }

  .parking-item{
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-align: left;
  }

  .parking-photo{
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel-line);
    border: 1px solid var(--panel-line);
  }

  .parking-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .parking-photo.empty{
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
    border: 1px dashed var(--panel-line);
  }

  .parking-photo.empty span{
    font-size: 0.72rem;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  .parking-item figcaption{
    margin: 0;
    font-size: 0.78rem;
    color: var(--ink-soft);
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  .parking-item figcaption strong{
    color: var(--accent-dark);
    font-weight: 600;
  }

  @media (max-width: 560px){
    .parking-gallery{ grid-template-columns: 1fr; max-width: 320px; }
  }

  footer{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 1.4rem 0 1.6rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }

  @media (max-width: 560px){
    nav.tabs{ gap: 0.2rem 0.1rem; }
    nav.tabs .tab{ font-size: 0.88rem; padding: 0.5rem 0.7rem; }
    .pane{ padding: 2.4rem 1.4rem; }
    .scenery{ height: 24vh; }
  }

  :focus-visible{
    outline: 2px solid var(--accent-dark);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .pane{ animation: none; }
  }
</style>
</head>

      <path d="M0,250 C120,210 260,240 400,200 C540,160 640,230 760,195 C900,155 1020,225 1200,200 L1200,300 L0,300 Z"

  <div class="page">
